name: Dependency health

on:
  schedule:
    - cron: "12 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@bda704ba2b2ea116c5ab8bbbbc2eabd79041587e # v0.17.3
    with:
      langs: node,actions
      lock: true
      min-age: 7d
      max-bump: minor
      validation-command: npm ci && make check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
