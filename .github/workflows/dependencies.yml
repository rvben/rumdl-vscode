name: Dependency health

on:
  schedule:
    - cron: "12 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: read
  pull-requests: read

jobs:
  update:
    uses: rvben/upd/.github/workflows/dependency-health.yml@7e6bee076ba17f80de23d49609ea7f4158045089 # v0.14.2
    with:
      langs: node,actions
      lock: true
      min-age: 7d
      max-bump: minor
      validation-command: npm ci && make check
      fail-on-blocked: false
      branch: deps/upd
      commit-message: "chore(deps): weekly dependency update"
