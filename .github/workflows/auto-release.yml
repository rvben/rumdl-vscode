name: Release Extension

# Dispatch prepares a PR. A vership tag on the merged release commit publishes it.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  repository_dispatch:
    types: [rumdl_release]
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Release type'
        required: true
        default: extension-only
        type: choice
        options:
          - extension-only
          - rumdl-update
      version_bump:
        description: 'Extension version bump'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      rumdl_version:
        description: 'rumdl version to bundle (without v prefix)'
        required: false
        type: string
      dry_run:
        description: 'Preview the release without pushing'
        required: false
        default: false
        type: boolean

concurrency:
  group: extension-release-${{ github.event_name == 'push' && github.ref || 'prepare' }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0 # vership needs history and tags for the changelog

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: dtolnay/rust-toolchain@stable
      - name: Install vership
        run: cargo install vership --locked

      - name: Determine release metadata
        id: meta
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_MODE: ${{ inputs.release_mode }}
          INPUT_BUMP: ${{ inputs.version_bump }}
          INPUT_VERSION: ${{ inputs.rumdl_version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = repository_dispatch ]; then
            RELEASE_MODE="rumdl-update"
            VERSION_BUMP='patch'
            RUMDL_VERSION="$DISPATCH_VERSION"
          else
            RELEASE_MODE="$INPUT_MODE"
            VERSION_BUMP="$INPUT_BUMP"
            RUMDL_VERSION="$INPUT_VERSION"
          fi
          case "$VERSION_BUMP" in
            patch|minor|major) ;;
            *) echo "::error::Unsupported version bump"; exit 1 ;;
          esac
          if [ "$RELEASE_MODE" = rumdl-update ]; then
            if ! [[ "$RUMDL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::rumdl_version must be a version such as 0.3.5"
              exit 1
            fi
            if [ "$GITHUB_EVENT_NAME" = repository_dispatch ] &&
                grep -Fq "const RUMDL_VERSION = '$RUMDL_VERSION';" scripts/download-rumdl.js; then
              echo "rumdl $RUMDL_VERSION is already bundled."
              exit 0
            fi
            echo "rumdl_version=$RUMDL_VERSION" >> "$GITHUB_OUTPUT"
          fi
          echo "version_bump=$VERSION_BUMP" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.meta.outputs.version_bump != ''
        run: npm ci

      - name: Update bundled rumdl and schema
        if: steps.meta.outputs.rumdl_version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUMDL_VERSION: ${{ steps.meta.outputs.rumdl_version }}
        run: |
          set -euo pipefail
          make set-rumdl-version RUMDL_VERSION="$RUMDL_VERSION"
          make schema
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/download-rumdl.js src/configSchema.ts
            git add -u schemas/
            git commit -m "chore: update bundled rumdl to v$RUMDL_VERSION"
          fi

      - name: Release gate
        if: steps.meta.outputs.version_bump != ''
        run: |
          node scripts/audit-dependencies.mjs
          make check

      - name: Prepare release
        if: steps.meta.outputs.version_bump != ''
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION_BUMP: ${{ steps.meta.outputs.version_bump }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--skip-checks)
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          vership bump "$VERSION_BUMP" --prepare "${args[@]}"

      - name: Open release pull request
        if: steps.meta.outputs.version_bump != '' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUMDL_VERSION: ${{ steps.meta.outputs.rumdl_version }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          BRANCH="release/v$VERSION"
          EXISTING=$(gh pr list --head "$BRANCH" --base main --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING" ]; then
            if [ -n "$RUMDL_VERSION" ]; then
              git fetch origin "refs/heads/$BRANCH"
              if ! git show FETCH_HEAD:scripts/download-rumdl.js | grep -F "const RUMDL_VERSION = '$RUMDL_VERSION';" >/dev/null; then
                echo "::error::The pending release PR bundles a different rumdl version: $EXISTING"
                exit 1
              fi
            fi
            echo "A release PR already exists for v$VERSION: $EXISTING"
            exit 0
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --head "$BRANCH" --base main --title "chore: prepare release v$VERSION" --body-file - <<EOF
          Prepare extension v$VERSION with vership.

          Approve the workflow runs if GitHub requests it, then merge once validate and test pass.
          To publish, run \`vership release\` from the updated main checkout. The v$VERSION tag starts the build and publishing workflow.
          EOF

  tagged-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate tagged release
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Release tag does not match package.json version"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tag must identify a commit merged into main"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Release gate
        run: |
          npm ci
          node scripts/audit-dependencies.mjs
          make check

  # Phase 2: build platform-specific VSIX packages in parallel.
  build:
    needs: tagged-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - win32-x64
          - darwin-x64
          - darwin-arm64
          - linux-x64
          - linux-arm64
          - alpine-x64
          - alpine-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tagged-release.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build VSIX for ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make package-target TARGET=${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: dist/*.vsix

  # Phase 3: publish to both registries and create the GitHub release.
  # Open VSX and GitHub still run after a Marketplace failure, but only with
  # validated artifacts.
  publish:
    needs: [tagged-release, build]
    if: ${{ !cancelled() && needs.tagged-release.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tagged-release.outputs.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          path: dist/
          merge-multiple: true
      - name: Validate VSIX artifacts
        id: artifacts
        run: |
          COUNT=$(find dist/ -name '*.vsix' | wc -l | tr -d ' ')
          echo "Found $COUNT VSIX package(s):"
          ls -lh dist/ || true
          if [ "$COUNT" -ne 7 ]; then
            echo "::error::Expected all 7 platform packages before publishing"
            exit 1
          fi
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: make publish-marketplace
      - name: Publish to Open VSX
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: make publish-ovsx
      - name: Create GitHub release
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make github-release
