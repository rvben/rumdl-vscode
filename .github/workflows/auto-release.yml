name: Release Extension

# Every step runs a `make` target so the whole release is reproducible locally.
# Versioning, changelog, tag, and push are handled by vership (`make release-*`).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  repository_dispatch:
    types: [rumdl_release]
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Release type'
        required: true
        default: extension-only
        type: choice
        options:
          - extension-only
          - rumdl-update
      version_bump:
        description: 'Extension version bump'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      rumdl_version:
        description: 'rumdl version to bundle (without v prefix)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (preview the bump; skip build/publish)'
        required: false
        default: false
        type: boolean

jobs:
  # Phase 1: update bundled rumdl (if needed), then bump + changelog + tag + push via vership.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_mode: ${{ steps.meta.outputs.release_mode }}
      version_bump: ${{ steps.meta.outputs.version_bump }}
      rumdl_version: ${{ steps.meta.outputs.rumdl_version }}
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep GITHUB_TOKEN: CI-created tags must not start a second release run.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # vership needs full history + tags to build the changelog

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # vership drives version bump + changelog + tag + push.
      # Swap for a prebuilt-binary install if one is available for faster CI.
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name != 'push'
      - name: Install vership
        if: github.event_name != 'push'
        run: cargo install vership --locked

      - name: Install dependencies
        run: npm ci

      - name: Determine release metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            RELEASE_MODE="rumdl-update"
            VERSION_BUMP="patch"
            VERSION="${{ github.event.client_payload.version }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            RELEASE_MODE="prepared"
            VERSION_BUMP=""
            VERSION=""
          else
            RELEASE_MODE="${{ inputs.release_mode }}"
            VERSION_BUMP="${{ inputs.version_bump }}"
            VERSION="${{ inputs.rumdl_version }}"
          fi
          if [ "$RELEASE_MODE" = "rumdl-update" ] && [ -z "$VERSION" ]; then
            echo "::error::rumdl_version is required for a rumdl-update release"
            exit 1
          fi
          {
            echo "release_mode=$RELEASE_MODE"
            echo "version_bump=$VERSION_BUMP"
            echo "rumdl_version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Verify rumdl release exists
        if: ${{ steps.meta.outputs.release_mode == 'rumdl-update' }}
        run: |
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/rvben/rumdl/releases/tags/v${{ steps.meta.outputs.rumdl_version }}")
            if [ "$CODE" = "200" ]; then exit 0; fi
            echo "rumdl v${{ steps.meta.outputs.rumdl_version }} not found yet (attempt $i/3), waiting for API propagation..."
            sleep 60
          done
          echo "::error::rumdl v${{ steps.meta.outputs.rumdl_version }} not found on GitHub releases"
          exit 1

      - name: Update bundled rumdl + schema
        if: ${{ steps.meta.outputs.release_mode == 'rumdl-update' && !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make set-rumdl-version RUMDL_VERSION=${{ steps.meta.outputs.rumdl_version }}
          make schema
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add scripts/download-rumdl.js
          git add -f schemas/ 2>/dev/null || true
          # sync-schema also regenerates src/configSchema.ts; stage it too so the tree
          # is clean before vership's pre-flight runs in the next step.
          git add src/configSchema.ts
          git commit -m "chore: update bundled rumdl to v${{ steps.meta.outputs.rumdl_version }}"

      - name: Release gate (lint + compile tests)
        run: make check

      - name: Bump version, changelog, tag, push
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag pushed by vership already names the prepared release commit.
          # Validate it and publish it without preparing a second version.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            VERSION=$(node -p "require('./package.json').version")
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "::error::Release tag does not match package.json version"
              exit 1
            fi
            echo "new_version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          VERSION_BUMP="${{ steps.meta.outputs.version_bump }}"
          case "$VERSION_BUMP" in
            patch|minor|major) ;;
            *) echo "::error::Unsupported version bump: $VERSION_BUMP"; exit 1 ;;
          esac
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            make "release-$VERSION_BUMP" VERSHIP_ARGS="--skip-checks --dry-run"
          else
            make "release-$VERSION_BUMP" VERSHIP_ARGS="--skip-checks"
          fi
          echo "new_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  # Phase 2: build platform-specific VSIX packages in parallel.
  build:
    needs: prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - win32-x64
          - darwin-x64
          - darwin-arm64
          - linux-x64
          - linux-arm64
          - alpine-x64
          - alpine-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.prepare.outputs.new_version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Build VSIX for ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make package-target TARGET=${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-${{ matrix.target }}
          path: dist/*.vsix

  # Phase 3: publish to both registries and create the GitHub release.
  # Open VSX and GitHub still run after a Marketplace failure, but only with
  # validated artifacts.
  publish:
    needs: [prepare, build]
    if: ${{ !inputs.dry_run && !cancelled() && needs.prepare.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.prepare.outputs.new_version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Download all VSIX artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: vsix-*
          path: dist/
          merge-multiple: true
      - name: Validate VSIX artifacts
        id: artifacts
        run: |
          COUNT=$(find dist/ -name '*.vsix' | wc -l | tr -d ' ')
          echo "Found $COUNT VSIX package(s):"
          ls -lh dist/ || true
          if [ "$COUNT" -ne 7 ]; then
            echo "::error::Expected all 7 platform packages before publishing"
            exit 1
          fi
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: make publish-marketplace
      - name: Publish to Open VSX
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: make publish-ovsx
      - name: Create GitHub release
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make github-release

  dry-run-summary:
    needs: prepare
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "Dry run complete for '${{ needs.prepare.outputs.release_mode }}' mode."
          echo "Previewed the '${{ needs.prepare.outputs.version_bump }}' version bump and changelog via 'vership bump --dry-run'."
          echo "No commit, tag, build, or publish was performed."
